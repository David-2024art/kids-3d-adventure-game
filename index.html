<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>魔法森林探险</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="overlay" class="overlay">
      <div class="panel">
        <span class="badge">儿童3D冒险</span>
        <h1>魔法森林探险</h1>
        <p>
          帮助小勇者收集闪亮的星光水晶，避开偷偷偷走光芒的小影子怪兽！
        </p>
        <ul>
          <li>使用 ↑ ↓ ← → 或 WASD 移动</li>
          <li>收集 8 个水晶即可过关</li>
          <li>在 60 秒内完成任务</li>
        </ul>
        <button id="startButton">开始冒险</button>
      </div>
    </div>

    <div id="hud" class="hud hidden">
      <div class="tag">分数 <span id="score">0</span></div>
      <div class="tag">时间 <span id="time">60</span>s</div>
      <div class="tag">剩余 <span id="starsLeft">8</span></div>
    </div>

    <script type="module" src="./game.js"></script>
  </body>
</html>
